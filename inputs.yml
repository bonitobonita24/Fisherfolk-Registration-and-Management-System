modules:
  - name: dashboard
    url_prefix: /dashboard
  - name: fisherfolk
    url_prefix: /fisherfolk
  - name: vessels
    url_prefix: /vessels
  - name: violations
    url_prefix: /violations
  - name: edit-requests
    url_prefix: /edit-requests
  - name: kanban
    url_prefix: /kanban
  - name: reports
    url_prefix: /reports
  - name: analytics
    url_prefix: /analytics
  - name: id-generator
    url_prefix: /id-generator
  - name: map
    url_prefix: /map
  - name: notifications
    url_prefix: /notifications
  - name: settings
    url_prefix: /settings
  - name: user-management
    url_prefix: /user-management
  - name: tenant-management
    url_prefix: /tenant-management
  - name: ayuda
    url_prefix: /ayuda
  - name: audit-log
    url_prefix: /audit-log

apps:
  - name: web
    framework: next
    port: 44387

packages:
  - shared
  - api-client
  - db
  - ui
  - jobs
  - storage

jobs:
  enabled: true
  provider: bullmq
  queues:
    - name: bulk-import
      description: Resumable CSV/Excel bulk import of fisherfolk records
      retry: 3
      backoff: exponential
      backoff_delays: [1000, 4000, 16000]
      dlq: true
      resumable: true
    - name: yearly-status-reset
      description: Annual reset of fisherfolk registration status
      retry: 3
      backoff: exponential
      backoff_delays: [1000, 4000, 16000]
      dlq: true
      cron: "0 0 1 1 *"
    - name: email-notification-digest
      description: Batched email notification digest delivery
      retry: 3
      backoff: exponential
      backoff_delays: [1000, 4000, 16000]
      dlq: true
      cron: "0 8 * * *"

storage:
  enabled: true
  provider: minio
  max_file_size_mb: 10
  allowed_types:
    - image/jpeg
    - image/png
    - image/webp
    - application/pdf
  inline_processing:
    - sharp
    - qrcode

reporting:
  enabled: true
  kpis:
    - Total registered fisherfolk
    - Active vs expired registrations
    - Registrations by barangay
    - Violation count by type
    - Vessel count by type
    - Ayuda distribution summary
  chart_types:
    - bar
    - line
    - pie
    - area
  export_formats:
    - csv
    - pdf

maps:
  enabled: true
  provider: leaflet
  features:
    - pin_markers
    - barangay_clusters
    - violation_heatmap

navigation:
  type: sidebar
  hardcoded: false

ports:
  dev:
    db: 44377
    pgbouncer: 44378
    redis: 44379
    minio: 44380
    minio_console: 44381
    mailhog: 44382
    mailhog_ui: 44383
    pgadmin: 44384
    app: 44387
    worker: 44388
    prisma_studio: 44397

docker:
  publish: true
  registry: docker.io
  hub_repo: bonitobonita24/frms
  image_name: frms
  platforms:
    - linux/amd64
    - linux/arm64
  build_on_push_to: main
  dev_build: true

git:
  default_branch: main
  branch_pattern: "feat/{slug}"
  commit_style: conventional
  squash_merge: true
  use_worktrees: false

models:
  planning: claude-code
  execution: claude-sonnet-4-6
  governance: gemini-2.5-flash-lite

vibe_test:
  enabled: true

context7:
  enabled: true

accessibility:
  level: none

turnstile:
  enabled: true
  protected_pages:
    - login
  widget_mode: managed

security:
  data_sensitivity: high
  compliance:
    - DICT
    - Philippine_Data_Privacy_Act
  audit_events:
    - login
    - logout
    - record_create
    - record_update
    - record_delete
    - role_change
    - tenant_change
    - export
    - bulk_import
  cors_origins:
    dev: "http://localhost:44387"
    staging: "https://staging-frms.powerbyteitsolutions.app"
    prod: "https://frms.powerbyteitsolutions.app"
  rate_limiting:
    auth: 10
    api: 100
    public: 300
    upload: 20

smtp:
  per_tenant: true
  system_fallback: true

deploy:
  k8s:
    enabled: false
  komodo:
    enabled: true
    ui_url: "https://kmd.powerbyte.app/"
    auto_update_staging: true
    manual_deploy_prod: true

design:
  source: linear
  dark_mode: default
  light_mode_toggle: false
  accent_color: "#4F8EF7"
  tenant_configurable_accent: true
  banned_colors:
    - purple
    - violet

out_of_scope:
  - Light mode toggle
  - Multi-language / i18n
  - Native mobile apps (PWA only)
  - Offline-first mode
  - Payment processing / billing
  - SMS notifications (Twilio)
  - Real-time chat or messaging
  - AI-powered features (OCR, NLP)
  - Custom domain per tenant
  - Public registration (admin-only)
  - Third-party SSO (Google, Facebook)
  - Webhook integrations
  - Advanced GIS / geofencing
