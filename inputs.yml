version: 3

app:
  name: Fisherfolk Registration and Management System
  slug: frms
  purpose: Multi-tenant SaaS platform for Philippine LGU fisherfolk registration, compliance tracking, demographic intelligence, and resource management
  environments:
    - dev
    - staging
    - prod

domains:
  prod: frms.powerbyteitsolutions.app
  staging: staging-frms.powerbyteitsolutions.app

tenancy:
  mode: multi
  routing: subdirectory
  shared_global_data: false
  url_pattern: "/{tenant_slug}/dashboard"

auth:
  provider: authjs-v5
  strategy: credentials
  session_type: jwt
  jwt_fields:
    - userId
    - tenantId
    - roles
  mfa: false

roles:
  - name: super_admin
    scope: platform
    description: Platform-level administrator — manages all tenants
  - name: admin
    scope: tenant
    description: Tenant administrator — full CRUD within tenant, manages users and settings
  - name: encoder
    scope: tenant
    description: Data entry operator — creates and edits records within tenant
  - name: viewer
    scope: tenant
    description: Read-only access to dashboards and reports within tenant
  - name: bantay_dagat
    scope: tenant
    description: Sea patrol officer — logs violations, views vessel records

entities:
  - name: Fisherfolk
    fields:
      - id
      - tenantId
      - registrationNumber
      - firstName
      - middleName
      - lastName
      - suffix
      - dateOfBirth
      - gender
      - civilStatus
      - nationality
      - contactNumber
      - email
      - barangay
      - address
      - educationalAttainment
      - livelihoodType
      - organizationMembership
      - photoUrl
      - qrCodeData
      - status
      - statusExpiryDate
      - createdAt
      - updatedAt
      - createdBy
  - name: Vessel
    fields:
      - id
      - tenantId
      - fisherfolkId
      - vesselName
      - vesselType
      - registrationNumber
      - material
      - length
      - width
      - tonnage
      - engineType
      - horsepower
      - homePort
      - status
      - photoUrl
      - createdAt
      - updatedAt
  - name: Violation
    fields:
      - id
      - tenantId
      - fisherfolkId
      - vesselId
      - violationType
      - description
      - dateOfViolation
      - location
      - reportedBy
      - status
      - resolution
      - penaltyAmount
      - evidenceUrls
      - createdAt
      - updatedAt
  - name: EditRequest
    fields:
      - id
      - tenantId
      - entityType
      - entityId
      - requestedBy
      - requestedChanges
      - reason
      - status
      - reviewedBy
      - reviewedAt
      - createdAt
  - name: Comment
    fields:
      - id
      - tenantId
      - entityType
      - entityId
      - userId
      - content
      - createdAt
  - name: AuditLog
    fields:
      - id
      - tenantId
      - userId
      - action
      - entity
      - entityId
      - before
      - after
      - ipAddress
      - createdAt
  - name: User
    fields:
      - id
      - tenantId
      - username
      - email
      - passwordHash
      - firstName
      - lastName
      - role
      - isActive
      - securityVersion
      - lastLoginAt
      - createdAt
      - updatedAt
  - name: Tenant
    fields:
      - id
      - name
      - slug
      - isActive
      - logoUrl
      - accentColor
      - smtpHost
      - smtpPort
      - smtpUser
      - smtpPasswordEncrypted
      - smtpFrom
      - smtpFromName
      - createdAt
      - updatedAt
  - name: Category
    fields:
      - id
      - tenantId
      - type
      - name
      - description
      - isActive
      - createdAt
  - name: KanbanTask
    fields:
      - id
      - tenantId
