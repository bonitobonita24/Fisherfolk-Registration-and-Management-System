name: Docker Build & Publish

on:
  push:
    branches: [main]
    paths-ignore:
      - '.cline/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

# NOTE (staging deploy is GATED — data-first, owner-set 2026-07-11):
# This job BUILDS + PUSHES the image only (tags: latest, staging-latest, sha-<short>).
# It does NOT auto-deploy staging. Staging is deployed ONLY via
# `deploy/staging-refresh-and-deploy.sh` so the prod→staging data refresh always runs
# BEFORE the new image + migrations. Keep the staging Komodo stack's auto_update OFF.
# Production promotion stays a separate, explicit manual step. See ~/.claude/rules/staging-refresh-gate.md.

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/frms

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=staging-latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          # All deploy targets (Hostinger VPS + WSL2 dev) are amd64; arm64 was pure
          # build cost (slow QEMU emulation) with no consumer, and pushed the uncached
          # build past the timeout. Restrict to amd64. (2026-08-09)
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
