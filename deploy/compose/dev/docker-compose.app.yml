# Dev app service — builds from source, direct port mapping
# Staging/prod use image-only (no build: key) + Traefik routing

networks:
  app_network:
    name: ${COMPOSE_PROJECT_NAME}_network
    external: true

services:
  app:
    build:
      context: ../../..
      dockerfile: apps/web/Dockerfile
    image: ${DOCKERHUB_USERNAME}/${IMAGE_NAME}:dev-latest
    container_name: ${COMPOSE_PROJECT_NAME}_app
    hostname: ${COMPOSE_PROJECT_NAME}_app
    env_file: ../../../.env.dev
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AUTH_TRUST_HOST=true
      - DATABASE_URL=postgresql://frms_7041ec0ed8e0d0b610f826:ydd5BAU%2FEeQ36eLMXG9Uxg@frms_dev_postgres:5432/frms_dev?schema=public
      - REDIS_URL=redis://:hTMUhH3HnsalCIjzrG3Vi1@frms_dev_valkey:6379
    ports:
      - "${APP_PORT}:3000"
    networks: [app_network]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
